<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My Notes</h1>
            <div class="controls">
                <select id="sort-select">
                    <option value="newest">Newest to Oldest</option>
                    <option value="oldest">Oldest to Newest</option>
                </select>
                <button id="add-note-btn" class="primary-btn">+ New Note</button>
            </div>
        </header>

        <main id="notes-grid" class="notes-grid">
            <!-- Notes will be injected here -->
        </main>

        <!-- Modal for Add/Edit -->
        <div id="note-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title">Add Note</h2>
                <form id="note-form">
                    <input type="text" id="note-title" placeholder="Note Title" required maxlength="100">
                    <textarea id="note-text" placeholder="Note Content (max 1000 chars)" required maxlength="1000"></textarea>
                    <div class="char-count"><span id="char-count">0</span>/1000</div>
                    <div class="modal-actions">
                        <button type="button" id="cancel-btn" class="secondary-btn">Cancel</button>
                        <button type="submit" class="primary-btn">Save Note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
